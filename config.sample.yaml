data_path: ./data
logs_path:
credential_encryption_key: "" # leave blank to auto-generate and persist a key at <data_path>/credential_encryption.key
virtual_tag: current
tags_check_interval: 24h
tag_discovery_ttl: 1h # how long a repository's discovered tag list is cached before "Check repository" refreshes it in the background
session_lifetime: 168h
# secure_cookies: defaults to true when tls.enabled is true, false otherwise; set explicitly to override
web_server_listen: ":8080"
proxy_server_listen: ":5000"
trusted_proxies: [] # only trusted if your reverse proxy appends to X-Forwarded-For, not passes it through as-is
tls:
  enabled: false
  cert_file: ""
  key_file: ""
login_rate_limit:
  enabled: true
  max_attempts: 5
  window: 15m
  bypass_ips: []
blob_cache:
  enabled: true
  path: "" # defaults to <data_path>/cache; set explicitly to store the cache elsewhere
  lifetime: 24h
  cleanup_interval: 1h
smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
  tls: true
webhooks: []
proxy_auth:
  enabled: false