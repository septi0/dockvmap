# Minimal example. Every setting is optional and has a built-in default.
# Full reference: README, "Configuration" section.

# CIDRs/IPs of reverse proxies allowed to report the real client IP.
# Use ["gateway"] to trust the container's default gateway (Docker bridge + published port).
trusted_proxies: []

# Terminate HTTPS in DockVMap instead of at a reverse proxy.
# tls:
#   enabled: true
#   cert_file: /etc/dockvmap/tls/cert.pem
#   key_file: /etc/dockvmap/tls/key.pem

# Email notifications when a tracked image's tags change.
# smtp:
#   enabled: true
#   host: smtp.example.com
#   from: dockvmap@example.com
#   username: user
#   password: pass
