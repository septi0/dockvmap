logs_path:
tag_filters_path: # leave blank to use the built-in default filters
credential_encryption_key: "" # leave blank to auto-generate and persist a key at <data-path>/credential_encryption.key
virtual_tag: current
tags_check_interval: 24h
tag_discovery_ttl: 1h # how long a repository's tag list is cached before it's refreshed
session_lifetime: 168h
# secure_cookies: true when tls.enabled is true, false otherwise
web_server_listen: ":8080"
proxy_server_listen: ":5000"
# proxy_public_host: "" # hostname (optionally host:port) clients use to pull images; defaults to the web UI's address if unset
trusted_proxies: [] # CIDRs/IPs of reverse proxies you trust for the real client IP (must append to X-Forwarded-For, not pass it through)
tls:
  enabled: false
  cert_file: ""
  key_file: ""
login_rate_limit:
  enabled: true
  max_attempts: 5
  window: 15m
  bypass_ips: []
blob_cache:
  enabled: true
  lifetime: 24h
  cleanup_interval: 1h
smtp:
  enabled: false
  host: ""
  port: 587
  username: ""
  password: ""
  from: ""
  tls: true
webhooks: []
proxy_auth:
  enabled: false