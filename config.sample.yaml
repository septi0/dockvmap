# Minimal example. Every setting is optional and has a built-in default.
# Full reference: README, "Configuration" section.

# CIDRs/IPs of reverse proxies allowed to report the real client IP.
# Use ["gateway"] to trust the container's default gateway (Docker bridge + published port).
trusted_proxies: []

# Terminate HTTPS in DockVMap instead of at a reverse proxy.
# tls:
#   enabled: true
#   cert_file: /etc/dockvmap/tls/cert.pem
#   key_file: /etc/dockvmap/tls/key.pem

# Email notifications when a tracked image's tags change.
# smtp:
#   enabled: true
#   host: smtp.example.com
#   from: dockvmap@example.com
#   username: user
#   password: pass

# Pass pushes and pulls of names that aren't virtual images through to a registry:3
# on DockVMap's stack network (plain HTTP, no login). See compose.registry.sample.yaml.
# For a registry that already serves TLS, set address to its certificate's name and tls: true.
# internal_registry:
#   enabled: true
#   address: registry:5000
#   tls: false
#   push_allowed_ips: ["10.0.0.5"]   # only these addresses can push; empty allows all
