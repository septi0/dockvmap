name: dockvmap

services:
  dockvmap:
    image: ghcr.io/septi0/dockvmap:latest
    restart: unless-stopped

    # add config as DOCKVMAP_<KEY> vars here (see config.sample.yaml for keys);
    # e.g. behind a reverse proxy:  DOCKVMAP_TRUSTED_PROXIES: gateway
    environment: {}

    volumes:
      - dockvmap-data:/data

    ports:
      - "5000:5000"
      - "8080:8080"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dockvmap-data:
