name: dockvmap

services:
  dockvmap:
    image: ghcr.io/septi0/dockvmap:latest
    restart: unless-stopped

    # add config as DOCKVMAP_<KEY> vars here (see config.sample.yaml for keys);
    # e.g. behind a reverse proxy:  DOCKVMAP_TRUSTED_PROXIES: gateway
    environment: {}

    volumes:
      - dockvmap-data:/data

    # with built-in TLS (DOCKVMAP_TLS_ENABLED: "true") the web UI moves to :8443;
    # publish "8443:8443" instead of "8080:8080" and point the healthcheck at
    # https://localhost:8443/health (wget --no-check-certificate for a self-signed cert)
    ports:
      - "5000:5000"
      - "8080:8080"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dockvmap-data:
