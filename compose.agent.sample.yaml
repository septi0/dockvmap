name: dockvmap-agent

services:
  dockvmap-agent:
    image: ghcr.io/septi0/dockvmap-agent:latest
    restart: unless-stopped

    # add the host on the Hosts page in dockvmap with this host's address; dockvmap connects here
    # and adopts the agent on its next check, so allow dockvmap through on this port
    ports:
      - "9002:9002"

    # environment:
    #   DOCKVMAP_AGENT_PROXY_ONLY: "true"   # report only containers pulled through the proxy

    # the agent only reads from Docker; for a strictly read-only setup, run a docker socket proxy
    # (e.g. tecnativa/docker-socket-proxy with CONTAINERS=1 IMAGES=1 INFO=1 EVENTS=1 VERSION=1),
    # set DOCKER_HOST: tcp://socket-proxy:2375 and drop the socket mount
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dockvmap-agent:/data   # the agent's identity and pairing, keep it across updates

volumes:
  dockvmap-agent:
