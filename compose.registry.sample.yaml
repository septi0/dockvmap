name: dockvmap

services:
  dockvmap:
    image: ghcr.io/septi0/dockvmap:latest
    restart: unless-stopped

    # pushes and pulls of names that aren't virtual images go through to the registry below;
    # set DOCKVMAP_INTERNAL_REGISTRY_ADDRESS only if you rename the registry service
    environment:
      DOCKVMAP_INTERNAL_REGISTRY_ENABLED: "true"
      # DOCKVMAP_PROXY_AUTH_ENABLED: "true"   # require a proxy token; pushes need one with Can push

      # replication (README, "Replication and follower mode"), on the primary:
      # DOCKVMAP_REPLICATION_ENABLED: "true"
      # DOCKVMAP_REPLICATION_ALLOWED_IPS: "10.0.0.12"   # only followers from these addresses
      # or on a follower, with a token from the primary's System > Replication page:
      # DOCKVMAP_FOLLOWER_ENABLED: "true"
      # DOCKVMAP_FOLLOWER_PRIMARY: "10.0.0.11:9003"   # the primary's own address
      # DOCKVMAP_FOLLOWER_TOKEN: "dvmr1-..."

    volumes:
      - dockvmap-data:/data

    ports:
      - "5000:5000"   # the proxy: push and pull here
      - "8080:8080"   # the web UI
      # - "10.0.0.11:9003:9003"   # on a primary: replication, on its own address, for followers only

    depends_on:
      - registry

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  registry:
    image: registry:3
    restart: unless-stopped

    # plain HTTP and no login: only DockVMap reaches it, over this stack's network,
    # so don't publish its port; DockVMap handles TLS and logins
    # environment:
    #   REGISTRY_STORAGE_DELETE_ENABLED: "true"   # with replication, the same on the primary and its followers
    volumes:
      - registry-data:/var/lib/registry   # every pushed image; back it up separately from DockVMap

volumes:
  dockvmap-data:
  registry-data:
