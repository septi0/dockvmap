<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;-webkit-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background-color:#ffffff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <tr>
              <td style="padding:24px 32px;border-bottom:1px solid #ececef;">
                <img src="cid:dockvmap-logo" alt="DockVMap" width="200" style="display:block;width:200px;max-width:60%;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 10px;font-size:11px;line-height:1;letter-spacing:0.09em;text-transform:uppercase;color:#2563eb;font-weight:700;">
                  Tag update
                </p>
                <h1 style="margin:0 0 14px;font-size:20px;line-height:1.3;color:#18181b;font-weight:700;">
                  {{.Action}}
                </h1>
                <p style="margin:0 0 22px;font-size:14px;line-height:1.6;color:#3f3f46;">
                  for virtual image <strong style="color:#18181b;">{{.ImageName}}</strong>
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e4e4e7;border-radius:8px;background-color:#fafafa;">
                  {{range .Tags}}<tr>
                    <td style="padding:11px 16px;border-bottom:1px solid #ececef;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.4;color:#18181b;word-break:break-all;">
                      {{.}}
                    </td>
                  </tr>{{end}}
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #ececef;background-color:#fafafa;">
                <p style="margin:0;font-size:12px;line-height:1.5;color:#a1a1aa;">
                  Sent automatically by DockVMap when a scheduled tag refresh detected this change.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
