<!DOCTYPE html>
<html>
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#18181b;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;border:1px solid #e4e4e7;">
      <h2 style="margin:0 0 12px;font-size:16px;">{{.Action}}</h2>
      <p style="margin:0 0 16px;font-size:14px;">for virtual image <strong>{{.ImageName}}</strong>:</p>
      <ul style="margin:0 0 20px;padding-left:20px;font-size:14px;">
        {{range .Tags}}<li style="font-family:ui-monospace,monospace;">{{.}}</li>
        {{end}}
      </ul>
      <p style="margin:0;font-size:12px;color:#71717a;">This was detected automatically by dockvmap's tag refresh.</p>
    </div>
  </body>
</html>
